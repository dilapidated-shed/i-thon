name: sdf-mailbox-email-d

on:
  push:
    branches: [d/sdf-mailbox-email]
  pull_request:
    paths:
      - d/sdf_mailbox_email/**
      - .github/workflows/sdf-mailbox-email-d.yml

permissions:
  contents: read

jobs:
  translated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dlang-community/setup-dlang@a6f7969b8b5dc3ff448c30f2c6749150795814f3 # v2
        with:
          compiler: dmd-latest
      - name: Run translated mailbox and MIME tests
        working-directory: d/sdf_mailbox_email
        run: >-
          dmd -w -unittest -Isource
          source/sdfmail/model.d source/sdfmail/mbox.d source/sdfmail/mime.d
          tests/translated_mailbox_email.d
          -of=translated-tests && ./translated-tests
      - name: Build streaming index command
        working-directory: d/sdf_mailbox_email
        run: >-
          dmd -w -Isource
          source/main.d source/sdfmail/model.d source/sdfmail/mbox.d source/sdfmail/mime.d
          -of=sdf-mailbox-email
